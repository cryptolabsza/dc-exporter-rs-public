# TRACEWEAVER: file-role=pool-build-caller; req=REQ-PUB-003; trace=TRACE-PUB-003; ver=VER-PUB-003
name: CI
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dc-exporter-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'cryptolabsza/dc-exporter-rs-public' &&
      github.repository_id == '1416116330' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_protected &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    uses: cryptolabsza/dc-exporter-rs-public/.github/workflows/ci-pool-build-recipe.yml@1948541081a3a62e0a127fde245399257d8c0ca1
    permissions:
      contents: read
